<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: https://georgesteve.github.io/regen-ra-multi/targets%20(1).mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="video2" src="https://georgesteve.github.io/regen-ra-multi/vid2.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video3" src="https://georgesteve.github.io/regen-ra-multi/vid3.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video4" src="https://georgesteve.github.io/regen-ra-multi/vid4.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <video id="video5" src="https://georgesteve.github.io/regen-ra-multi/vid5.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#video2" position="0 0 0" rotation="0 0 90" width="0.552" height="1"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 1">
        <a-video src="#video3" position="0 0 0" rotation="0 0 90" width="0.552" height="1"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 2">
        <a-video src="#video4" position="0 0 0" rotation="0 0 90" width="0.552" height="1"></a-video>
      </a-entity>
      <a-entity mindar-image-target="targetIndex: 3">
        <a-video src="#video5" position="0 0 0" rotation="0 0 90" width="0.552" height="1"></a-video>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('renderstart', () => {
        const targets = document.querySelectorAll('[mindar-image-target]');
        const videoIds = ['video2', 'video3', 'video4', 'video5'];

        targets.forEach((targetEl, index) => {
          const video = document.querySelector('#' + videoIds[index]);

          targetEl.addEventListener('targetFound', () => {
            video.play();
          });

          targetEl.addEventListener('targetLost', () => {
            video.pause();
          });
        });
      });
    </script>
  </body>
</html>
