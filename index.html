<html>
  <head>
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <script src="https://aframe.io/releases/1.5.0/aframe.min.js"></script>
    <script src="https://cdn.jsdelivr.net/gh/donmccurdy/aframe-extras@v7.0.0/dist/aframe-extras.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/mind-ar@1.2.5/dist/mindar-image-aframe.prod.js"></script>
  </head>
  <body>
    <a-scene mindar-image="imageTargetSrc: https://georgesteve.github.io/regen-ra-multi/targets%20(1).mind;" color-space="sRGB" renderer="colorManagement: true, physicallyCorrectLights" vr-mode-ui="enabled: false" device-orientation-permission-ui="enabled: false">
      <a-assets>
        <video id="bearVideo" src="https://georgesteve.github.io/regen-ra-multi/vid1.mp4" preload="auto" loop="true" muted="true" playsinline webkit-playsinline crossorigin="anonymous"></video>
        <a-asset-item id="raccoonModel" src="https://cdn.jsdelivr.net/gh/hiukim/mind-ar-js@1.2.5/examples/image-tracking/assets/band-example/raccoon/scene.gltf"></a-asset-item>
      </a-assets>

      <a-camera position="0 0 0" look-controls="enabled: false"></a-camera>

      <!-- Target 0: reproduce el video -->
      <a-entity mindar-image-target="targetIndex: 0">
        <a-video src="#bearVideo" position="0 0 0" rotation="0 0 0" width="1" height="0.552"></a-video>
      </a-entity>

      <!-- Target 1: modelo 3D del mapache -->
      <a-entity mindar-image-target="targetIndex: 1">
        <a-gltf-model rotation="0 0 0" position="0 -0.25 0" scale="0.05 0.05 0.05" src="#raccoonModel" animation-mixer></a-gltf-model>
      </a-entity>
    </a-scene>

    <script>
      const sceneEl = document.querySelector('a-scene');
      sceneEl.addEventListener('renderstart', () => {
        const targets = document.querySelectorAll('[mindar-image-target]');
        const video = document.querySelector('#bearVideo');
        const videoTarget = targets[0]; // targetIndex: 0

        videoTarget.addEventListener('targetFound', () => {
          video.play();
        });

        videoTarget.addEventListener('targetLost', () => {
          video.pause();
        });
      });
    </script>
  </body>
</html>
